# SIXDOGS: Postgres + core (owns the RCON password, polls the game) + bot (Discord).
#
#   docker compose up -d --build          real game server (RCON_URL in .env)
#   docker compose --profile mock up      practice run against a fake game server
#
# Nothing here is exposed to the internet: core's API is only reachable by the
# bot, on the private compose network.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sixdogs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sixdogs
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sixdogs"]
      interval: 5s
      retries: 20

  core:
    build: ./core
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RCON_URL: ${RCON_URL:?set RCON_URL in .env}
      RCON_PASSWORD: ${RCON_PASSWORD:?set RCON_PASSWORD in .env}
      DATABASE_URL: postgres://sixdogs:${POSTGRES_PASSWORD}@db:5432/sixdogs
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      SAMPLE_RETENTION_DAYS: ${SAMPLE_RETENTION_DAYS:-14}

  bot:
    build: ./bot
    restart: unless-stopped
    depends_on:
      - core
    env_file: .env
    volumes:
      - ./content:/content:ro   # channel posts (#rules, #server-info, #announcements)
    environment:
      CORE_URL: http://core:8080
      # The bot must never see the RCON password.
      RCON_PASSWORD: ""
      POSTGRES_PASSWORD: ""

  # Fake WARDOGS server for practice. Only starts with --profile mock.
  # Put RCON_URL=http://mock:7776 and RCON_PASSWORD=test in .env while practising.
  mock:
    profiles: ["mock"]
    image: node:22-alpine
    working_dir: /mock
    volumes:
      - ./mock:/mock:ro
    command: ["node", "mock-wardogs.mjs"]
    ports:
      - "127.0.0.1:7776:7776"

volumes:
  dbdata:
